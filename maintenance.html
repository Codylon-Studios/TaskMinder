<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintenance | TaskMinder</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    main {
      max-width: 42rem;
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.8);
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { line-height: 1.55; color: #cbd5e1; }
    .status {
      display: inline-block;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main>
    <span class="status">HTTP 503</span>
    <h1>TaskMinder is temporarily in maintenance mode</h1>
    <p>We are currently applying updates. Please try again in a few minutes.</p>
    <p>This page is served directly by the reverse proxy while maintenance mode is active.</p>
  </main>
</body>
</html>
