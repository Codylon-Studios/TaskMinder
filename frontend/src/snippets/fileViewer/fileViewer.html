<template id="file-viewer-template">
  <div class="card">
    <div class="file-viewer-metadata d-flex justify-content-between position-relative p-2 border-bottom">
      <div class="file-viewer-type mt-3 mt-sm-0">
        <i aria-hidden="true"></i>
        <span></span>
      </div>
      <div class="file-viewer-name fw-bold position-absolute start-50 translate-middle-x"></div>
      <div class="mt-3 mt-sm-0">
        <i class="far fa-floppy-disk me-1" aria-hidden="true"></i>
        <span class="file-viewer-size"></span>
      </div>
    </div>
    <div class="file-viewer-type-specific p-2 border-bottom">
      <div class="file-viewer-type-specific-plaintext ds-flex gap-2 align-items-center">
        <div class="form-text">
          <span class="file-viewer-type-specific-plaintext-characters"></span>
          Zeichen ·
          <span class="file-viewer-type-specific-plaintext-words"></span>
          Wörter
        </div>

        <div class="flex-grow-1"></div>

        <div class="btn-group">
          <input
            type="radio"
            class="btn-check"
            name="file-viewer-type-specific-plaintext-font"
            id="{{ID}}-type-specific-plaintext-font-proportional"
            checked
          />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-plaintext-font-proportional" aria-label="Proportional">
            <i class="fas fa-font" aria-hidden="true"></i>
          </label>
          <input type="radio" class="btn-check" name="file-viewer-type-specific-plaintext-font" id="{{ID}}-type-specific-plaintext-font-monospace" />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-plaintext-font-monospace" aria-label="Monospace">
            <i class="fas fa-code" aria-hidden="true"></i>
          </label>
        </div>
      </div>

      <div class="file-viewer-type-specific-markdown ds-flex gap-2 align-items-center">
        <div class="flex-grow-1"></div>

        <div class="btn-group">
          <input
            type="radio"
            class="btn-check"
            name="file-viewer-type-specific-markdown-display"
            id="{{ID}}-type-specific-markdown-display-styled"
            checked
          />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-markdown-display-styled" aria-label="Als Markdown">
            <i class="fab fa-markdown" aria-hidden="true"></i>
          </label>
          <input type="radio" class="btn-check" name="file-viewer-type-specific-markdown-display" id="{{ID}}-type-specific-markdown-display-source" />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-markdown-display-source" aria-label="Quelltext">
            <i class="fas fa-code" aria-hidden="true"></i>
          </label>
        </div>
      </div>

      <div class="file-viewer-type-specific-csv ds-flex gap-2 align-items-center">
        <div class="form-text">
          <span class="file-viewer-type-specific-csv-columns"></span>
          Spalten ·
          <span class="file-viewer-type-specific-csv-rows"></span>
          Zeilen
        </div>
      </div>

      <div class="file-viewer-type-specific-png ds-flex gap-2 align-items-center">
        <div class="form-text">
          <span class="file-viewer-type-specific-png-width"></span>
          ×
          <span class="file-viewer-type-specific-png-height"></span>
          Pixel
        </div>

        <div class="flex-grow-1"></div>

        <div class="btn-group">
          <input type="radio" class="btn-check" name="file-viewer-type-specific-png-render" id="{{ID}}-type-specific-png-render-smooth" checked />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-png-render-smooth" aria-label="Geglättet">
            <i class="fas fa-bezier-curve" aria-hidden="true"></i>
          </label>
          <input type="radio" class="btn-check" name="file-viewer-type-specific-png-render" id="{{ID}}-type-specific-png-render-pixelated" />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-png-render-pixelated" aria-label="Pixelig">
            <i class="fas fa-table-cells" aria-hidden="true"></i>
          </label>
        </div>

        <div class="btn-group">
          <input type="radio" class="btn-check" name="file-viewer-type-specific-png-bg" id="{{ID}}-type-specific-png-bg-transparent" checked />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-png-bg-transparent" aria-label="Transparent">
            <i class="far fa-square" aria-hidden="true"></i>
          </label>
          <input type="radio" class="btn-check" name="file-viewer-type-specific-png-bg" id="{{ID}}-type-specific-png-bg-checkerboard" />
          <label class="btn btn-outline-secondary btn-sm rounded-pill" for="{{ID}}-type-specific-png-bg-checkerboard" aria-label="Karomuster">
            <i class="fas fa-chess-board" aria-hidden="true"></i>
          </label>
        </div>
      </div>

      <div class="file-viewer-type-specific-jpeg ds-flex gap-2 align-items-center">
        <div class="form-text">
          <span class="file-viewer-type-specific-jpeg-width"></span>
          ×
          <span class="file-viewer-type-specific-jpeg-height"></span>
          Pixel
        </div>
      </div>
    </div>

    <div class="file-viewer-content file-viewer-plaintext p-2"></div>
    <div class="file-viewer-content file-viewer-markdown p-2">
      <div class="file-viewer-markdown-styled"></div>
      <div class="file-viewer-markdown-source"></div>
    </div>
    <table class="file-viewer-content file-viewer-csv table table-striped-columns mb-0"><tbody></tbody></table>
    <img class="file-viewer-content file-viewer-png" />
    <img class="file-viewer-content file-viewer-jpeg" />
    <div class="file-viewer-content file-viewer-mp3 p-2">
      <audio></audio>
      <div class="d-flex align-items-center gap-2 mb-2">
        <button
          class="btn btn-tertiary rounded-pill d-flex align-items-center justify-content-center file-viewer-mp3-play"
          aria-label="Pause oder Weiter"
        >
          <i class="fas fa-play" aria-hidden="true"></i>
        </button>
        <div class="flex-grow-1">
          <div class="file-viewer-mp3-progress progress cursor-pointer">
            <div class="file-viewer-mp3-progress-bar progress-bar"></div>
          </div>
          <div class="d-flex justify-content-between form-text mb-n4">
            <span class="file-viewer-mp3-progress-current-time"></span>
            <span class="file-viewer-mp3-progress-duration"></span>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <button
          class="btn btn-tertiary rounded-pill d-flex align-items-center justify-content-center file-viewer-mp3-mute"
          aria-label="Stumm oder Ton an"
        >
          <i class="fas fa-volume" aria-hidden="true"></i>
        </button>
        <div class="flex-grow-1">
          <div class="file-viewer-mp3-volume progress cursor-pointer">
            <div class="file-viewer-mp3-volume-bar progress-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <object class="file-viewer-object">
      <div class="alert alert-danger p-2 ds-flex align-items-center gap-2 m-2">
        <i class="fa-solid fa-circle-exclamation mx-1" aria-hidden="true"></i>
        <span class="d-block">Das Anzeigen dieser Datei wird nicht unterstützt.</span>
      </div>
    </object>
  </div>
  <div class="toast-container">
    <div id="file-viewer-unsafe-link" class="toast" data-bs-autohide="false">
      <div class="toast-header bg-warning text-body-bg">
        <span class="me-auto w-100 fw-bold">
          Fremder Link:
          <b class="word-wrap-break"></b>
        </span>
        <button type="button" class="btn-close btn-close-invert" data-bs-dismiss="toast" aria-label="Schließen"></button>
      </div>
      <div class="toast-body">
        Achtung, dieser Link führt auf eine andere Website:
        <br />
        <b></b>
        <br />
        <br />
        Klicke nur auf öffnen, wenn du diese Website kennst.
        <div class="mt-2 pt-2 border-top d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary btn-sm fw-semibold" data-bs-dismiss="toast">Abbrechen</button>
          <button type="button" class="btn btn-warning btn-sm fw-semibold" data-bs-dismiss="toast" id="file-viewer-unsafe-link-confirm">
            Öffnen
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
