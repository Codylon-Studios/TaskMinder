#=======================================================================
# LANDING PAGE CONTAINER
#=======================================================================
# Static root-domain page, baked into the image by the Dockerfile's
# `landing` stage: rebuilding the image is the release. The edge proxy
# terminates TLS and forwards the root host here, handling only /stats.
#
# Rendered by the nginx entrypoint's envsubst over
# /etc/nginx/templates/*.template. NGINX_ENVSUBST_FILTER in compose.yaml
# limits substitution to APP_HOST, so $request_uri survives untouched.
#
# Security headers are server level. Do NOT `add_header` inside a
# location: it drops every inherited server-level header. `expires` does
# not break inheritance, so the cache rules below are safe.
#=======================================================================

map $is_args $legacy_origin_separator {
    ""      "?";
    default "&";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; object-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    # markup, stylesheet and script change every release (must revalidate)
    location = / {
        try_files /pages/landing/landing.html =404;
        expires -1;
    }

    location ^~ /pages/landing/ {
        expires -1;
    }

    # Screenshots, font and favicon keep their names across releases.
    location ^~ /assets/landing/ {
        expires 30d;
    }

    location ^~ /assets/fonts/ {
        expires 1y;
    }

    location = /static/favicon.ico {
        expires 30d;
    }

    location = /robots.txt {
        expires -1;
    }

    location = /sitemap.xml {
        expires -1;
    }

    #-------------------------------------------------------------------
    # RETIREMENT OF THE OLD ROOT-DOMAIN APPLICATION
    #-------------------------------------------------------------------
    # Browsers that have not opened the site since the move still hold the
    # old service worker, caches and IndexedDB. These two responses swap in
    # a self-unregistering worker and stop the old shell hanging on a
    # missing /bootstrap.
    #-------------------------------------------------------------------
    location = /sw.js {
        try_files /sw-retire.js =404;
        default_type application/javascript;
        etag off;
        expires -1;
    }

    # Unique version string makes the old shell discard its caches.
    location = /bootstrap {
        default_type application/json;
        expires -1;
        return 200 '{"maintenance":false,"classJoined":false,"version":"retired","cacheEnabled":false}';
    }

    #-------------------------------------------------------------------
    # HANDOVER TO THE APPLICATION
    #-------------------------------------------------------------------
    # The two paths that were indexed under the root domain and that the
    # project page links to itself. Permanent, so search engines move the
    # ranking to the application host and browsers skip the hop next time.
    location = /join {
        return 308 https://${APP_HOST}$request_uri${legacy_origin_separator}legacy_origin;
    }

    location = /about {
        return 308 https://${APP_HOST}$request_uri${legacy_origin_separator}legacy_origin;
    }

    # Everything else the old root-domain application owned. Temporary on
    # purpose: a 308 here is cached by the browser forever per path, which
    # would block the root domain from ever serving a path of its own.
    location / {
        return 302 https://${APP_HOST}$request_uri${legacy_origin_separator}legacy_origin;
    }
}
