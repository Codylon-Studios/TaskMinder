name: "CI build for main"

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: NODE_ENV=PRODUCTION bun run build

      - name: Write secrets to files for Docker Compose
        run: |
          mkdir -p docker_secrets
          echo "${{ secrets.DB_HOST }}" > docker_secrets/db_host.txt
          echo "${{ secrets.DB_NAME }}" > docker_secrets/db_name.txt
          echo "${{ secrets.DB_PASSWORD }}" > docker_secrets/db_password.txt
          echo "${{ secrets.DB_USER }}" > docker_secrets/db_user.txt
          echo "${{ secrets.REDIS_PORT }}" > docker_secrets/redis_port.txt
          echo "${{ secrets.SESSION_SECRET }}" > docker_secrets/session_secret.txt
          echo "${{ secrets.DATABASE_URL }}" > docker_secrets/database_url.txt
          echo "${{ secrets.ENCRYPTION_KEY }}" > docker_secrets/encryption_key.txt
          echo "${{ secrets.ENCRYPTION_KEY_SECONDARY }}" > docker_secrets/encryption_key_secondary.txt
          echo "${{ secrets.ENCRYPTION_KEY_LOOKUP }}" > docker_secrets/encryption_key_lookup.txt
          echo "${{ secrets.PROXY_HOP }}" > docker_secrets/proxy_hop.txt

      - name: Build Docker Compose
        run: docker compose build
