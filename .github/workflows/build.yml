name: "CI build and smoke test for main"

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Write dummy secrets to files for Docker Compose
        run: |
          mkdir -p docker_secrets
          echo "taskminder" > docker_secrets/db_name.txt
          echo "postgres" > docker_secrets/db_password.txt
          echo "postgres" > docker_secrets/db_user.txt
          echo "test_session_secret" > docker_secrets/session_secret.txt
          echo "postgresql://postgres:postgres@taskminder-postgres:5432/taskminder?schema=public" > docker_secrets/database_url.txt
          echo "JzR4yoUwZnO3yimFdriAYvlYsSRLfFeH2hym+1Dquq4=" > docker_secrets/encryption_key.txt
          echo "sQJK7oZsGhOi5g39u1hN0RrolXdRyHu8qzJIGSWRfpU=" > docker_secrets/encryption_key_secondary.txt
          echo "GCHjxG/vSG387Z4WJnfImWlPnNTZh309AokNYRYLAQw=" > docker_secrets/encryption_key_lookup.txt
          echo "1" > docker_secrets/proxy_hop.txt

      - name: Build Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for server to start (Timeout approx 60s)
        run: |
          echo "Waiting for taskminder-app to be ready on port 3000..."
          for i in {1..60}; do
            # Use curl to check if the server responds on port 3000
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server successfully started and is responding on port 3000!"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to respond within 60 seconds."
          echo "Dumping container logs for debugging:"
          docker compose logs app
          exit 1
